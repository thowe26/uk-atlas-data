<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The UK Data Atlas</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/papaparse@5.3.0/papaparse.min.js"></script>
    
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f0f2f5; padding: 40px 20px; }
        .dashboard { max-width: 1000px; margin: 0 auto; }
        
        .card { 
            background: white; 
            padding: 30px; 
            border-radius: 12px; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.05); 
            margin-bottom: 40px;
        }
        
        h1 { color: #1a1a1a; text-align: center; margin-bottom: 40px; font-weight: 800; letter-spacing: -1px; }
        h2 { color: #2c3e50; margin-top: 0; font-size: 1.5rem; border-bottom: 2px solid #f0f2f5; padding-bottom: 15px; margin-bottom: 20px; }
        .source { color: #7f8c8d; font-size: 0.85rem; text-align: right; margin-top: 10px; display: block; }
        
        canvas { width: 100% !important; height: 350px !important; }
    </style>
</head>
<body>

    <div class="dashboard">
        <h1>The UK Data Atlas</h1>

        <div class="card">
            <h2>1. The Cost of Living (Inflation)</h2>
            <div style="position: relative; height:350px; width:100%">
                <canvas id="inflationChart"></canvas>
            </div>
            <span class="source">Source: ONS Series MM23 (Auto-Updated)</span>
        </div>

        <div class="card">
            <h2>2. Net Migration to the UK (1975–2023)</h2>
            <div style="position: relative; height:350px; width:100%">
                <canvas id="migrationChart"></canvas>
            </div>
            <span class="source">Source: ONS Long-Term International Migration Estimates</span>
        </div>
    </div>

    <script>
        // --- CHART 1: INFLATION CONFIG ---
        Papa.parse('data/cpi_inflation.csv', {
            download: true,
            header: true,
            complete: function(results) {
                const data = results.data.filter(r => r.Date && r.CPI_Inflation);
                const ctx = document.getElementById('inflationChart').getContext('2d');
                
                new Chart(ctx, {
                    type: 'line',
                    data: {
                        labels: data.map(r => r.Date),
                        datasets: [{
                            label: 'Inflation Rate (%)',
                            data: data.map(r => r.CPI_Inflation),
                            borderColor: '#e74c3c',
                            backgroundColor: 'rgba(231, 76, 60, 0.1)',
                            borderWidth: 2,
                            pointRadius: 0,
                            fill: true,
                            tension: 0.3
                        }]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        interaction: { mode: 'index', intersect: false },
                        scales: {
                            x: { type: 'category', ticks: { maxTicksLimit: 8 } },
                            y: { beginAtZero: true }
                        }
                    }
                });
            }
        });

        // --- CHART 2: MIGRATION CONFIG ---
        Papa.parse('data/net_migration_long_term.csv', {
            download: true,
            header: true,
            complete: function(results) {
                const data = results.data.filter(r => r.Year && r.Net_Migration);
                const ctx = document.getElementById('migrationChart').getContext('2d');
                
                new Chart(ctx, {
                    type: 'bar',
                    data: {
                        labels: data.map(r => r.Year),
                        datasets: [{
                            label: 'Net Migration (People)',
                            data: data.map(r => r.Net_Migration),
                            backgroundColor: data.map(r => r.Net_Migration < 0 ? '#e74c3c' : '#2980b9'), // Red for negative, Blue for positive
                            borderRadius: 2
                        }]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        plugins: {
                            legend: { display: false }
                        },
                        scales: {
                            x: { grid: { display: false } },
                            y: { 
                                title: { display: true, text: 'Net People (Thousands)' },
                                ticks: {
                                    callback: function(value) { return value / 1000 + 'k'; }
                                }
                            }
                        }
                    }
                });
            }
        });
    </script>
</body>
</html>
