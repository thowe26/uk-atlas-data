name: Update ONS Data

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'

    - name: Install Dependencies
      run: |
        pip install pandas requests

    - name: Run Fetch Script
      run: |
        python scripts/update_data.py

    - name: Commit and Push Changes
      run: |
        git config --global user.name "AtlasBot"
        git config --global user.email "bot@atlas.uk"
        git add data/*.csv
        git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update ONS data" && git push)
